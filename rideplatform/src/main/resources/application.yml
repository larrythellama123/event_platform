server:
  port: 8082

app:
  topic: trip-events

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rides
    username: rides
    password: rides
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: core-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.rideplatform.core.model.TripEvent
        spring.json.trusted.packages: com.rideplatform.core.model


        